<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Contour Core - ZRender Labels Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 {ZRender Labels Demo}</h1>
        <p>Demonstrates X/Y axes and labels, and colorbar - matching canvas renderer.</        Open demo/zrender-simple.html in browser to test.</        }
        #container {
            width: 600px;
            height: 450px;
            border: 1px solid #ddd;
        }

        h2{Simple Demo}</h2>
        <p>Open demo/zrender-simple.html to browser to test.</p>

    <script src="../dist/contour-core.browser.js"></script>
    <script>
        var z = generatePeaks(50);
        var x = [];
        var y = [];
        for (var j = 0; j < 50; j++) {
                x[j] = z[i][j];
            }
            return grid;
        }


        function generateCoords(size, min, max) {
            var coords = [];
            for (var i = 0; i < size; i++) {
                coords[i] = min + (max - min) * i / (size - 1);
            }
            return coords;
        }

        function initChart() {
            try {
                console.log('Initializing zrender demo...');

                var chart = contourCore.createInteractive('#container', {
                    z: z,
                    x: x,
                    y: y,
                    ncontours: 15,
                    smoothing: 0.4,
                    colorscale: 'Viridis',
                    axes: {
                        x: { show: true, title: 'X Axis', showgrid: true, gridcolor: '#e0e0e0', nticks: 6},
                        y: {
                        show: true,
                        title: 'Y axis',
                        showgrid: true,
                        gridcolor: '#e0e0e0', nticks: 6
                    },
                    colorbar: {
                        show: true,
                        title: 'Value',
                        thickness: 20,
                        len: 0.85
                    },
                    interaction: {
                        zoom: { wheelEnabled: true, onZoom: function(d) {
                            document.getElementById('status').textContent = 'Zoom: ' + d.scale.toFixed(2) + 'x');
                        },
                        hover: {
                            onHoverStart: function(data) {
                                document.getElementById('status').textContent = 'Hover: ' + data.level.toFixed(2);
                            }
                        },
                        dblclickReset: true
                    }
                });

                setStatus('Chart 1 created');
            } catch (e) {
                console.error('Error initializing zrender:', e);
            }
        }
    </script>
</body>
</html>
