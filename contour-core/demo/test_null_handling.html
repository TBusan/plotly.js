<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Null 值处理测试 - Contour-Core</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .canvas-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        canvas {
            border: 2px solid #333;
            background: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .info {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
        .success {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
        }
        .controls {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        label {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Null 值处理测试</h1>

    <div class="info">
        <strong>测试目的：</strong> 验证等值线在遇到 null 值时的正确处理。
        <br><br>
        <strong>预期结果：</strong>
        <ul>
            <li>等值线不应该穿过 null 区域（白色方格区域）</li>
            <li>null 区域应该被正确遮盖，不显示等值线</li>
            <li>等值线应该在 null 区域边界处停止或绕过</li>
        </ul>
    </div>

    <div class="controls">
        <button onclick="testCase1()">测试 1: 中心 null 区域</button>
        <button onclick="testCase2()">测试 2: 条状 null 区域</button>
        <button onclick="testCase3()">测试 3: 随机 null 点</button>
        <button onclick="testCase4()">测试 4: 边缘 null 区域</button>
        <label>
            <input type="checkbox" id="showLines" checked onchange="rerunTest()">
            显示等值线
        </label>
        <label>
            <input type="checkbox" id="connectGaps" checked onchange="rerunTest()">
            连接空隙
        </label>
    </div>

    <div class="canvas-container">
        <canvas id="canvas" width="600" height="500"></canvas>
    </div>

    <div class="info" id="result">
        点击上方按钮运行测试
    </div>

    <script src="../dist/contour-core.browser.min.js"></script>
    <script>
        var currentTestCase = null;
        var COLOR_SCALES = {
            Viridis: ['#440154', '#482878', '#3e4a89', '#31688e', '#26838f', '#1f9d8a', '#35b779', '#6dcd59', '#b4de2c', '#fde725'],
        };

        function parseColorScale(colorscale) {
            var colors = COLOR_SCALES[colorscale] || COLOR_SCALES.Viridis;
            return colors.map(function(color, i) {
                return [i / (colors.length - 1), color];
            });
        }

        function buildColorScale(levels, colorScale) {
            return levels.map(function(level, i) {
                var t = levels.length > 1 ? (i / (levels.length - 1)) : 0.5;
                var colorIdx = Math.floor(t * (colorScale.length - 1));
                colorIdx = Math.max(0, Math.min(colorScale.length - 1, colorIdx));
                return [level, colorScale[colorIdx][1]];
            });
        }

        // 测试用例 1: 中心 null 区域
        function testCase1() {
            var size = 20;
            var grid = { z: [], x: [], y: [] };
            var nullCenter = { i: 10, j: 10, radius: 3 };

            for (var i = 0; i < size; i++) {
                grid.z[i] = [];
                grid.y.push(i);
                for (var j = 0; j < size; j++) {
                    if (i === 0) grid.x.push(j);

                    // 在中心区域创建 null 值
                    var di = i - nullCenter.i;
                    var dj = j - nullCenter.j;
                    var dist = Math.sqrt(di * di + dj * dj);

                    if (dist < nullCenter.radius) {
                        grid.z[i][j] = null;
                    } else {
                        var dx = j - size / 2;
                        var dy = i - size / 2;
                        grid.z[i][j] = 100 * Math.exp(-(dx * dx + dy * dy) / 50);
                    }
                }
            }

            currentTestCase = {
                grid: grid,
                name: '中心 null 区域'
            };
            runTest();
        }

        // 测试用例 2: 条状 null 区域
        function testCase2() {
            var size = 20;
            var grid = { z: [], x: [], y: [] };

            for (var i = 0; i < size; i++) {
                grid.z[i] = [];
                grid.y.push(i);
                for (var j = 0; j < size; j++) {
                    if (i === 0) grid.x.push(j);

                    // 创建垂直条状 null 区域
                    if (j >= 8 && j <= 11) {
                        grid.z[i][j] = null;
                    } else {
                        var dx = j - size / 2;
                        var dy = i - size / 2;
                        grid.z[i][j] = 100 * Math.exp(-(dx * dx + dy * dy) / 50);
                    }
                }
            }

            currentTestCase = {
                grid: grid,
                name: '条状 null 区域'
            };
            runTest();
        }

        // 测试用例 3: 随机 null 点
        function testCase3() {
            var size = 20;
            var grid = { z: [], x: [], y: [] };
            var nullFraction = 0.15; // 15% null 值

            for (var i = 0; i < size; i++) {
                grid.z[i] = [];
                grid.y.push(i);
                for (var j = 0; j < size; j++) {
                    if (i === 0) grid.x.push(j);

                    // 随机 null 值
                    if (Math.random() < nullFraction) {
                        grid.z[i][j] = null;
                    } else {
                        var dx = j - size / 2;
                        var dy = i - size / 2;
                        grid.z[i][j] = 100 * Math.exp(-(dx * dx + dy * dy) / 50);
                    }
                }
            }

            currentTestCase = {
                grid: grid,
                name: '随机 null 点'
            };
            runTest();
        }

        // 测试用例 4: 边缘 null 区域
        function testCase4() {
            var size = 20;
            var grid = { z: [], x: [], y: [] };

            for (var i = 0; i < size; i++) {
                grid.z[i] = [];
                grid.y.push(i);
                for (var j = 0; j < size; j++) {
                    if (i === 0) grid.x.push(j);

                    // 边缘区域 null
                    if (i < 3 || i >= size - 3 || j < 3 || j >= size - 3) {
                        grid.z[i][j] = null;
                    } else {
                        var dx = j - size / 2;
                        var dy = i - size / 2;
                        grid.z[i][j] = 100 * Math.exp(-(dx * dx + dy * dy) / 50);
                    }
                }
            }

            currentTestCase = {
                grid: grid,
                name: '边缘 null 区域'
            };
            runTest();
        }

        function runTest() {
            if (!currentTestCase) return;

            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext('2d');
            var grid = currentTestCase.grid;

            // 清空画布
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 计算等值线
            var startTime = performance.now();
            var connectGaps = document.getElementById('connectGaps').checked;
            var result = contourCore.computeContours(grid, {
                autocontour: true,
                ncontours: 10,
                smoothing: 0,
                connectgaps: connectGaps
            });
            var endTime = performance.now();

            var colorScale = parseColorScale('Viridis');
            var mappedColors = buildColorScale(result.levels, colorScale);

            var showLines = document.getElementById('showLines').checked;

            var style = {
                width: canvas.width,
                height: canvas.height,
                padding: 50,
                coloring: 'fill',
                colorScale: mappedColors,
                showLines: showLines,
                lineWidth: 1,
                nullRegion: {
                    visible: true,
                    fill: '#ffffff',  // 白色遮盖
                    stroke: '#cccccc',
                    strokeWidth: 0.5,
                    showStroke: true
                },
                z: grid.z,
                x: grid.x,
                y: grid.y
            };

            // 绘制
            contourCore.renderers.canvas.drawContours(ctx, result, style);

            // 显示结果
            var resultDiv = document.getElementById('result');
            resultDiv.className = 'info success';
            resultDiv.innerHTML =
                '<strong>' + currentTestCase.name + ' - 测试完成！</strong><br>' +
                '✓ Null 值数量: ' + result.nullCount + '<br>' +
                '✓ 有效值数量: ' + result.validCount + '<br>' +
                '✓ 等值线级别: ' + result.levels.length + '<br>' +
                '✓ 计算时间: ' + (endTime - startTime).toFixed(2) + ' ms<br><br>' +
                '<strong>验证要点：</strong><br>' +
                '• 白色方格区域为 null 值位置<br>' +
                '• 等值线不应该穿过白色方格区域<br>' +
                '• 等值线应该在 null 区域边界处停止';
        }

        function rerunTest() {
            if (currentTestCase) {
                runTest();
            }
        }

        // 初始化
        testCase1();
    </script>
</body>
</html>
