<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标尺与标注 - Contour-Core</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .controls {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .control-group label {
            font-weight: bold;
            color: #555;
            font-size: 14px;
            margin-bottom: 5px;
        }
        select, input[type="range"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            min-width: 150px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            margin-top: 20px;
        }
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .display-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .panel {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
        }
        .panel h3 {
            margin-top: 0;
            color: #667eea;
            text-align: center;
        }
        .canvas-wrapper, .svg-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 450px;
        }
        canvas {
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
        }
        .svg-wrapper svg {
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
        }
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
            font-size: 14px;
        }
        .feature-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .feature-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .feature-icon {
            width: 30px;
            height: 30px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回 Demo 列表</a>

        <h1>等值线标尺与标注</h1>
        <p class="subtitle">展示 colorbar 标尺和等值线标注功能</p>

        <div class="info-box">
            <strong>功能说明：</strong><br>
            • <strong>标尺 (Colorbar)</strong>：右侧的颜色渐变条，显示数值与颜色的对应关系<br>
            • <strong>标注 (Labels)</strong>：沿等值线显示的数值标签，自动避免重叠
        </div>

        <div class="controls">
            <div class="control-group">
                <label>渲染模式</label>
                <select id="renderMode">
                    <option value="fill" selected>填充模式</option>
                    <option value="lines">线条模式</option>
                </select>
            </div>
            <div class="control-group">
                <label>颜色方案</label>
                <select id="colorscale">
                    <option value="Viridis" selected>Viridis</option>
                    <option value="Plasma">Plasma</option>
                    <option value="Hot">Hot</option>
                    <option value="Jet">Jet</option>
                    <option value="Earth">Earth</option>
                </select>
            </div>
            <div class="control-group">
                <label>等值线数量</label>
                <select id="ncontours">
                    <option value="5">5</option>
                    <option value="8">8</option>
                    <option value="12" selected>12</option>
                    <option value="16">16</option>
                </select>
            </div>
            <div class="control-group">
                <label>标注大小</label>
                <select id="labelSize">
                    <option value="10">小 (10px)</option>
                    <option value="12" selected>中 (12px)</option>
                    <option value="14">大 (14px)</option>
                    <option value="16">很大 (16px)</option>
                </select>
            </div>
            <div class="control-group">
                <label>显示标尺</label>
                <select id="showColorbar">
                    <option value="true" selected>显示</option>
                    <option value="false">隐藏</option>
                </select>
            </div>
            <div class="control-group">
                <label>显示标注</label>
                <select id="showLabels">
                    <option value="true" selected>显示</option>
                    <option value="false">隐藏</option>
                </select>
            </div>
        </div>

        <div style="text-align: center;">
            <button onclick="updateRender()">更新渲染</button>
        </div>

        <div class="display-grid">
            <div class="panel">
                <h3>Canvas 渲染</h3>
                <div class="canvas-wrapper">
                    <canvas id="canvasOutput" width="550" height="450"></canvas>
                </div>
            </div>
            <div class="panel">
                <h3>SVG 渲染</h3>
                <div class="svg-wrapper" id="svgOutput"></div>
            </div>
        </div>

        <div class="feature-list">
            <div class="feature-item">
                <div class="feature-icon">1</div>
                <span>自动标注定位：算法智能选择最佳标注位置</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">2</div>
                <span>避免重叠：标注之间自动保持间距</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">3</div>
                <span>沿路径旋转：标注文字沿等值线方向旋转</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">4</div>
                <span>颜色标尺：直观展示数值-颜色映射</span>
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button onclick="location.href='svg-data-samples.html'">SVG 数据示例</button>
            <button onclick="location.href='test-clip-mask.html'">Clip Mask 测试</button>
            <button onclick="location.href='index.html'">返回首页</button>
        </div>
    </div>

    <script src="../dist/contour-core.browser.min.js"></script>
    <script>
        var COLOR_SCALES = {
            Viridis: ['#440154', '#482878', '#3e4a89', '#31688e', '#26838f', '#1f9d8a', '#35b779', '#6dcd59', '#b4de2c', '#fde725'],
            Plasma: ['#0d0887', '#46039f', '#7201a8', '#9c179e', '#bd3786', '#d8576b', '#ed7953', '#fb9f3a', '#fdca26', '#f0f921'],
            Hot: ['#000000', '#4a0000', '#880000', '#c20000', '#ff0000', '#ff4a00', '#ff8800', '#ffc200', '#ffff00', '#ffff80'],
            Jet: ['#000080', '#0000ff', '#0080ff', '#00ffff', '#80ff80', '#ffff00', '#ff8000', '#ff0000', '#800000', '#000000'],
            Earth: ['#2a1c0b', '#5c4033', '#8f6b4e', '#c19a6b', '#e5c99b', '#f5e6c8', '#8b4513', '#a0522d', '#cd853f', '#deb887']
        };

        // 生成演示数据 - 双峰高斯分布
        function generateDemoGrid() {
            var size = 30;
            var grid = { z: [], x: [], y: [] };

            for (var i = 0; i < size; i++) {
                grid.z[i] = [];
                grid.y.push(i);
                for (var j = 0; j < size; j++) {
                    if (i === 0) grid.x.push(j);

                    // 主峰
                    var dx1 = j - size * 0.35;
                    var dy1 = i - size * 0.35;
                    var peak1 = 80 * Math.exp(-(dx1 * dx1 + dy1 * dy1) / 40);

                    // 次峰
                    var dx2 = j - size * 0.65;
                    var dy2 = i - size * 0.65;
                    var peak2 = 60 * Math.exp(-(dx2 * dx2 + dy2 * dy2) / 30);

                    // 添加一些波动
                    var wave = 8 * Math.sin(i * 0.3) * Math.cos(j * 0.3);

                    grid.z[i][j] = peak1 + peak2 + wave;
                }
            }
            return grid;
        }

        function createGrid(zData) {
            var m = zData.length;
            var n = zData[0].length;
            var grid = { z: zData, x: [], y: [] };
            for (var i = 0; i < n; i++) grid.x.push(i);
            for (var j = 0; j < m; j++) grid.y.push(j);
            return grid;
        }

        function parseColorScale(colorscale) {
            var colors = COLOR_SCALES[colorscale] || COLOR_SCALES.Viridis;
            return colors.map(function(color, i) {
                return [i / (colors.length - 1), color];
            });
        }

        function buildColorScale(levels, colorScale) {
            return levels.map(function(level, i) {
                var t = levels.length > 1 ? (i / (levels.length - 1)) : 0.5;
                var colorIdx = Math.floor(t * (colorScale.length - 1));
                colorIdx = Math.max(0, Math.min(colorScale.length - 1, colorIdx));
                return [level, colorScale[colorIdx][1]];
            });
        }

        function updateRender() {
            var mode = document.getElementById('renderMode').value;
            var colorscale = document.getElementById('colorscale').value;
            var ncontours = parseInt(document.getElementById('ncontours').value);
            var labelSize = parseInt(document.getElementById('labelSize').value);
            var showColorbar = document.getElementById('showColorbar').value === 'true';
            var showLabels = document.getElementById('showLabels').value === 'true';

            var grid = generateDemoGrid();

            var options = {
                autocontour: true,
                ncontours: ncontours,
                smoothing: 0.3
            };

            var result = contourCore.computeContours(grid, options);

            var colorScale = parseColorScale(colorscale);
            var mappedColors = buildColorScale(result.levels, colorScale);

            var style = {
                width: 550,
                height: 450,
                padding: 50,  // 增加padding为colorbar留出空间
                coloring: mode,
                colorScale: mappedColors,
                colorscale: colorscale,
                smoothing: 0.3,
                showLines: mode === 'lines' || mode === 'fill',
                lineWidth: 1.5,
                z: grid.z,
                x: grid.x,
                y: grid.y,
                // 标注设置
                showLabels: showLabels,
                labelSize: labelSize,
                labelColor: '#000',
                labelFont: 'Arial',
                // 标尺设置
                colorbar: showColorbar,
                colorbarTitle: 'Z Value',
                colorbarThickness: 20,
                colorbarLen: 0.75
            };

            // Canvas 渲染
            var canvas = document.getElementById('canvasOutput');
            var ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            contourCore.renderers.canvas.drawContours(ctx, result, style);

            // SVG 渲染
            var svg = contourCore.renderers.svg.renderSVG(result, style);
            document.getElementById('svgOutput').innerHTML = svg;
        }

        // 初始化
        updateRender();
    </script>
</body>
</html>
