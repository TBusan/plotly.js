<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Null 值调试</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f5f5f5; }
        .canvas-container { margin: 20px 0; }
        canvas { border: 2px solid #333; background: white; }
        .info { background: #e3f2fd; padding: 15px; margin: 10px 0; border-radius: 4px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Null 值调试测试</h1>

    <div class="info" id="output"></div>

    <div class="canvas-container">
        <canvas id="canvas" width="600" height="500"></canvas>
    </div>

    <button onclick="test1()">测试1: 少量null值</button>
    <button onclick="test2()">测试2: 大量null值（data2）</button>
    <button onclick="test3()">测试3: connectGaps=false</button>

    <script src="../dist/contour-core.browser.min.js"></script>
    <script>
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');
        var output = document.getElementById('output');

        function log(msg) {
            output.innerHTML += msg + '<br>';
            console.log(msg);
        }

        function clearLog() {
            output.innerHTML = '';
        }

        function test1() {
            clearLog();
            log('<strong>测试1: 少量null值</strong>');

            var grid = {
                z: [
                    [1, 2, 3, 4, 5],
                    [2, 3, null, 5, 6],
                    [3, 4, 5, 6, 7],
                    [4, 5, 6, 7, 8],
                    [5, 6, 7, 8, 9]
                ],
                x: [0, 1, 2, 3, 4],
                y: [0, 1, 2, 3, 4]
            };

            render(grid, { connectgaps: true });
        }

        function test2() {
            clearLog();
            log('<strong>测试2: 大量null值（data2）</strong>');

            var data2 = [
                [null, null, null, 12, 13, 14, 15, 16],
                [null, 1, null, 11, null, null, null, 17],
                [null, 2, 6, 7, null, null, null, 18],
                [null, 3, null, 8, null, null, null, 19],
                [5, 4, 10, 9, null, null, null, 20],
                [null, null, null, 27, null, null, null, 21],
                [null, null, null, 26, 25, 24, 23, 22]
            ];

            var grid = {
                z: data2,
                x: [0, 1, 2, 3, 4, 5, 6, 7],
                y: [0, 1, 2, 3, 4, 5, 6]
            };

            render(grid, { connectgaps: true });
        }

        function test3() {
            clearLog();
            log('<strong>测试3: connectGaps=false</strong>');

            var grid = {
                z: [
                    [1, 2, 3, 4, 5],
                    [2, 3, null, 5, 6],
                    [3, 4, 5, 6, 7],
                    [4, 5, 6, 7, 8],
                    [5, 6, 7, 8, 9]
                ],
                x: [0, 1, 2, 3, 4],
                y: [0, 1, 2, 3, 4]
            };

            render(grid, { connectgaps: false });
        }

        function render(grid, options) {
            try {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                var startTime = performance.now();

                var result = contourCore.computeContours(grid, {
                    autocontour: true,
                    ncontours: 8,
                    smoothing: 0,
                    ...options
                });

                var endTime = performance.now();

                log('✓ 计算完成: ' + (endTime - startTime).toFixed(2) + 'ms');
                log('  - Null 值数量: ' + result.nullCount);
                log('  - 有效值数量: ' + result.validCount);
                log('  - 等值线级别: ' + result.levels.length);
                log('  - 路径数量: ' + result.paths.length);

                var colorScale = [[0, 'blue'], [0.5, 'green'], [1, 'red']];

                var style = {
                    width: canvas.width,
                    height: canvas.height,
                    padding: 50,
                    coloring: 'lines',
                    colorScale: colorScale,
                    showLines: true,
                    lineWidth: 2,
                    lineColor: '#333',
                    nullRegion: {
                        visible: true,
                        fill: '#ffffff',
                        stroke: '#999999',
                        strokeWidth: 1,
                        showStroke: true
                    },
                    z: grid.z,
                    x: grid.x,
                    y: grid.y
                };

                contourCore.renderers.canvas.drawContours(ctx, result, style);
                log('✓ 渲染完成');
            } catch (e) {
                log('❌ 错误: ' + e.message);
                console.error(e);
            }
        }

        // 初始化运行测试1
        test1();
    </script>
</body>
</html>
