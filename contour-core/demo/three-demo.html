<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Contour Core - Three.js Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        #container {
            width: 800px;
            height: 600px;
            border: 1px solid #ccc;
            margin: 20px 0;
            background: #fff;
        }
        .controls {
            margin: 10px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
        }
        button {
            margin: 5px;
            padding: 8px 16px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #0056b3;
        }
        #info {
            margin: 10px 0;
            padding: 10px;
            background: #e7f3ff;
            border-radius: 4px;
            font-size: 14px;
        }
        .row {
            display: flex;
            gap: 10px;
            margin: 5px 0;
        }
        .row label {
            min-width: 100px;
            line-height: 32px;
        }
        select, input {
            padding: 5px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Contour Core - Three.js WebGL Renderer Demo</h1>

    <div class="controls">
        <div class="row">
            <label>Coloring Mode:</label>
            <select id="coloring-mode">
                <option value="fill">Fill</option>
                <option value="lines">Lines</option>
                <option value="heatmap">Heatmap</option>
            </select>
        </div>
        <div class="row">
            <label>Smoothing:</label>
            <input type="range" id="smoothing" min="0" max="1" step="0.1" value="0.3">
            <span id="smoothing-value">0.3</span>
        </div>
        <div class="row">
            <button onclick="resetView()">Reset View</button>
            <button onclick="toggleInteraction()">Toggle Interaction</button>
            <button onclick="reRender()">Re-render</button>
        </div>
    </div>

    <div id="info">
        <strong>Interactions:</strong>
        <ul>
            <li>Mouse wheel - Zoom in/out (centered on cursor)</li>
            <li>Click and drag - Pan</li>
            <li>Hover over contours - Show level info</li>
        </ul>
    </div>

    <div id="container"></div>

    <div id="status" style="margin-top:10px;padding:10px;background:#f0f0f0;border-radius:4px;">
        Status: <span id="status-text">Loading...</span>
    </div>

    <!-- Three.js from CDN (r160+) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <!-- contour-core browser bundle -->
    <script src="../dist/contour-core.browser.js"></script>

    <script>
        var renderer = null;
        var currentZoom = 1;
        var interactionEnabled = true;

        // Generate test data - simple peaks
        function generateGrid(size) {
            var grid = [];
            for (var i = 0; i < size; i++) {
                grid[i] = [];
                for (var j = 0; j < size; j++) {
                    var x = (i - size / 2) / 8;
                    var y = (j - size / 2) / 8;
                    var z = Math.sin(x * 2) * Math.cos(y * 2) * 15 + 25;
                    z += Math.sin(x * 5 + y * 3) * 5;
                    grid[i][j] = z;
                }
            }
            return grid;
        }

        function setStatus(msg) {
            document.getElementById('status-text').textContent = msg;
        }

        function initRenderer() {
            try {
                // Check Three.js
                if (typeof THREE === 'undefined') {
                    setStatus('Error: Three.js not loaded!');
                    return;
                }

                // Check contourCore
                if (typeof contourCore === 'undefined') {
                    setStatus('Error: contour-core not loaded!');
                    return;
                }

                // Create Three.js renderer
                var ThreeRenderer = contourCore.renderers.three.ThreeContourRenderer;
                renderer = new ThreeRenderer(document.getElementById('container'), {
                    width: 800,
                    height: 600,
                    backgroundColor: 0xffffff,
                    antialias: true
                });

                // Initialize interactions
                renderer.initZoom({
                    wheelEnabled: true,
                    minScale: 0.3,
                    maxScale: 5,
                    onZoom: function(data) {
                        currentZoom = data.scale;
                        setStatus('Zoom: ' + data.scale.toFixed(2) + 'x');
                    }
                });

                renderer.initPan({
                    dragEnabled: true,
                    onPanStart: function() {
                        setStatus('Panning...');
                    },
                    onPanEnd: function() {
                        setStatus('Ready');
                    }
                });

                renderer.initHover({
                    onHover: function(data) {
                        setStatus('Hover: Level ' + data.level.toFixed(2));
                    }
                });

                renderer.initClick({
                    onClick: function(data) {
                        console.log('Clicked level:', data.level);
                    }
                });

                // Initial render
                reRender();

                setStatus('Ready - Three.js renderer created!');
            } catch (e) {
                setStatus('Error: ' + e.message);
                console.error(e);
            }
        }

        function reRender() {
            if (!renderer) return;

            var coloring = document.getElementById('coloring-mode').value;
            var smoothing = parseFloat(document.getElementById('smoothing').value);

            // Compute contours
            var grid = generateGrid(50);
            var result = contourCore.computeContours({
                z: grid,
                ncontours: 15,
                smoothing: smoothing
            });

            // Style options
            var style = {
                width: 800,
                height: 600,
                padding: 50,
                coloring: coloring,
                showLines: coloring !== 'lines',
                lineColor: '#555555',
                lineWidth: 1.5,
                smoothing: smoothing,
                colorScale: [
                    [0, '#313695'],
                    [0.25, '#4575b4'],
                    [0.5, '#fee090'],
                    [0.75, '#f46d43'],
                    [1, '#a50026']
                ]
            };

            // Render contours
            renderer.renderContours(result, style);

            // Render axes
            var axesConfig = {
                x: {
                    range: [0, grid.length - 1],
                    ticks: [0, 10, 20, 30, 40, 49],
                    ticklabels: ['0', '10', '20', '30', '40', '50'],
                    showgrid: true
                },
                y: {
                    range: [0, grid[0].length - 1],
                    ticks: [0, 10, 20, 30, 40, 49],
                    ticklabels: ['0', '10', '20', '30', '40', '50'],
                    showgrid: true
                }
            };
            renderer.renderAxes(axesConfig, style);

            // Render colorbar
            renderer.renderColorbar(result, style.colorScale, {
                show: coloring !== 'lines',
                title: 'Value',
                width: 20,
                height: 400,
                x: 760,
                y: 80
            });
        }

        function resetView() {
            if (renderer) {
                renderer.resetView(true);
                currentZoom = 1;
                setStatus('View reset');
            }
        }

        function toggleInteraction() {
            if (renderer) {
                interactionEnabled = !interactionEnabled;
                renderer.setInteractionEnabled(interactionEnabled);
                setStatus('Interaction ' + (interactionEnabled ? 'enabled' : 'disabled'));
            }
        }

        // Update smoothing display
        document.getElementById('smoothing').addEventListener('input', function(e) {
            document.getElementById('smoothing-value').textContent = e.target.value;
        });

        // Re-render on option change
        document.getElementById('coloring-mode').addEventListener('change', reRender);
        document.getElementById('smoothing').addEventListener('change', reRender);

        // Initialize when page loads
        window.onload = function() {
            initRenderer();
        };

        // Handle resize
        window.onresize = function() {
            if (renderer) {
                renderer.resize(800, 600);
            }
        };
    </script>
</body>
</html>
