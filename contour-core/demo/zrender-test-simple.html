<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Contour Core - Simple ZRender Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #container { width: 800px; height: 600px; border: 1px solid #ccc; background: white; }
        #log { margin-top: 20px; padding: 10px; background: #f0f0f0; font-family: monospace; }
    </style>
</head>
<body>
    <h1>ZRender Simple Test</h1>
    <div id="container"></div>
    <div id="log"></div>

    <!-- zrender is bundled in contour-core.browser.js -->
    <script src="../dist/contour-core.browser.js"></script>

    <script>
        function log(msg) {
            document.getElementById('log').innerHTML += msg + '<br>';
            console.log(msg);
        }

        try {
            log('Starting test...');
            log('contourCore available: ' + !!contourCore);
            log('contourCore.createInteractive: ' + !!contourCore.createInteractive);

            // Generate simple test data
            function generateGrid(size) {
                var grid = [];
                for (var i = 0; i < size; i++) {
                    grid[i] = [];
                    for (var j = 0; j < size; j++) {
                        var x = (i - size / 2) / 10;
                        var y = (j - size / 2) / 10;
                        grid[i][j] = Math.sin(x) * Math.cos(y) * 10 + 25;
                    }
                }
                return grid;
            }

            log('Creating interactive chart...');

            var chart = contourCore.createInteractive('#container', {
                z: generateGrid(30),
                contours: {
                    type: 'fill'
                },
                ncontours: 10,
                smoothing: 0.5,
                colorscale: 'Viridis'
            });

            log('Chart created: ' + !!chart);
            log('View state: ' + JSON.stringify(chart.getView()));

        } catch (e) {
            log('ERROR: ' + e.message);
            log('Stack: ' + e.stack);
        }
    </script>
</body>
</html>
