<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay 交互式绘制测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .canvas-container {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        canvas {
            border: 1px solid #ddd;
            cursor: crosshair;
        }
        .controls {
            width: 280px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .controls h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        .mode-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }
        .mode-btn {
            padding: 8px 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn:hover {
            border-color: #4CAF50;
        }
        .mode-btn.active {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        .option-group {
            margin-bottom: 12px;
        }
        .option-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .option-group input, .option-group select {
            width: 100%;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .action-btn {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-complete {
            background: #4CAF50;
            color: white;
        }
        .btn-complete:hover {
            background: #45a049;
        }
        .btn-cancel {
            background: #f44336;
            color: white;
        }
        .btn-cancel:hover {
            background: #da190b;
        }
        .btn-clear {
            background: #ff9800;
            color: white;
        }
        .btn-clear:hover {
            background: #e68900;
        }
        .status {
            margin-top: 15px;
            padding: 10px;
            background: #e3f2fd;
            border-radius: 4px;
            font-size: 13px;
            color: #1565c0;
        }
        .log {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            background: #263238;
            color: #4CAF50;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
        .log-entry {
            margin: 2px 0;
        }
        .instructions {
            background: #fff3e0;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .instructions strong {
            color: #e65100;
        }
    </style>
</head>
<body>
    <h1>Overlay 交互式绘制测试</h1>

    <div class="container">
        <div class="canvas-container">
            <canvas id="canvas" width="1000" height="900"></canvas>
        </div>

        <div class="controls">
            <h3>绘制控制</h3>

            <div class="instructions">
                <strong>使用说明：</strong><br>
                • 点/文字：点击一次<br>
                • 线/面: 点击多次，双击或按 Enter 完成，Esc 取消
            </div>

            <div class="mode-buttons">
                <button class="mode-btn active" data-mode="point">点</button>
                <button class="mode-btn" data-mode="line">线</button>
                <button class="mode-btn" data-mode="polygon">面</button>
                <button class="mode-btn" data-mode="text">文字</button>
                <button class="mode-btn" data-mode="none">仅查看</button>
            </div>

            <div id="pointOptions" class="options">
                <div class="option-group">
                    <label>颜色</label>
                    <input type="color" id="pointColor" value="#ff0000">
                </div>
                <div class="option-group">
                    <label>大小</label>
                    <input type="range" id="pointSize" min="5" max="30" value="10">
                </div>
                <div class="option-group">
                    <label>形状</label>
                    <select id="pointShape">
                        <option value="circle">圆形</option>
                        <option value="square">方形</option>
                        <option value="triangle">三角形</option>
                        <option value="diamond">菱形</option>
                        <option value="star">星形</option>
                    </select>
                </div>
            </div>

            <div id="lineOptions" class="options" style="display:none;">
                <div class="option-group">
                    <label>颜色</label>
                    <input type="color" id="lineColor" value="#0066ff">
                </div>
                <div class="option-group">
                    <label>宽度</label>
                    <input type="range" id="lineWidth" min="1" max="10" value="2">
                </div>
                <div class="option-group">
                    <label>样式</label>
                    <select id="lineStyle">
                        <option value="solid">实线</option>
                        <option value="dashed">虚线</option>
                        <option value="dotted">点线</option>
                    </select>
                </div>
            </div>

            <div id="polygonOptions" class="options" style="display:none;">
                <div class="option-group">
                    <label>填充颜色</label>
                    <input type="color" id="polygonFillColor" value="#00ff00">
                </div>
                <div class="option-group">
                    <label>填充透明度</label>
                    <input type="range" id="polygonOpacity" min="10" max="90" value="30">
                </div>
                <div class="option-group">
                    <label>边框颜色</label>
                    <input type="color" id="polygonStrokeColor" value="#008800">
                </div>
                <div class="option-group">
                    <label>边框宽度</label>
                    <input type="range" id="polygonStrokeWidth" min="1" max="5" value="2">
                </div>
            </div>

            <div id="textOptions" class="options" style="display:none;">
                <div class="option-group">
                    <label>文字内容</label>
                    <input type="text" id="textContent" value="标注" placeholder="输入文字">
                </div>
                <div class="option-group">
                    <label>颜色</label>
                    <input type="color" id="textColor" value="#000000">
                </div>
                <div class="option-group">
                    <label>字号</label>
                    <input type="range" id="textFontSize" min="10" max="24" value="14">
                </div>
            </div>

            <button id="cancelBtn" class="action-btn btn-cancel" style="margin-bottom: 10px;">
                取消当前绘制 (Esc)
            </button>

            <button id="clearBtn" class="action-btn btn-clear">
                清除所有 Overlay
            </button>

            <div class="status" id="status">
                模式： 点 | 点击画布添加点
            </div>

            <div class="log" id="log">
                <div class="log-entry">准备就绪</div>
            </div>
        </div>
    </div>

    <script src="../dist/contour-core.browser.js"></script>
    <script>
        var canvas = document.getElementById('canvas');
        var ctx = canvas.getContext('2d');

        // 生成等值线数据
        var z = [];
        for (var i = 0; i < 20; i++) {
            z[i] = [];
            for (var j = 0; j < 20; j++) {
                z[i][j] = Math.sin(i/3) * Math.cos(j/3) * 10;
            }
        }

        // 渲染等值线
        var result = contourCore.computeContours({ z: z }, {
            autocontour: true,
            ncontours: 10
        });

        var renderer = contourCore.renderers.canvas.drawContours(ctx, result, {
            width: 1000,
            height: 900,
            padding: 50,
            coloring: 'fill+lines',
            interaction: { zoom: true, pan: true, dblclickReset: true }
        });

        // 通过 renderer.getOverlay() 获取 Overlay 系统
        var overlaySystem = renderer.getOverlay();

        // 当前模式
        var currentMode = 'point';

        // DOM 元素
        var modeButtons = document.querySelectorAll('.mode-btn');
        var clearBtn = document.getElementById('clearBtn');
        var cancelBtn = document.getElementById('cancelBtn');
        var statusEl = document.getElementById('status');
        var logEl = document.getElementById('log');

        // 选项面板
        var optionPanels = {
            point: document.getElementById('pointOptions'),
            line: document.getElementById('lineOptions'),
            polygon: document.getElementById('polygonOptions'),
            text: document.getElementById('textOptions'),
            none: null
        };

        // 日志函数
        function log(message) {
            var entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            logEl.insertBefore(entry, logEl.firstChild);
        }

        // 更新状态
        function updateStatus() {
            var modeText = {
                point: '点',
                line: '线',
                polygon: '面',
                text: '文字',
                none: '仅查看'
            };
            var actionText = {
                point: '点击画布添加点',
                line: '点击画布添加线的顶点',
                polygon: '点击画布添加面的顶点',
                text: '点击画布添加文字',
                none: '可缩放/平移查看'
            };
            var tempPoints = overlaySystem.getTempPoints();
            var pointsInfo = tempPoints.length > 0 ? ' (已添加 ' + tempPoints.length + ' 个点)' : '';
            statusEl.textContent = '模式: ' + modeText[currentMode] + ' | ' + actionText[currentMode] + pointsInfo;
        }

        // 切换模式
        function setMode(mode) {
            // 先停止当前绘制
            overlaySystem.stopDrawing();

            currentMode = mode;

            // 更新按钮状态
            modeButtons.forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });

            // 显示/隐藏选项面板
            Object.keys(optionPanels).forEach(function(key) {
                if (optionPanels[key]) {
                    optionPanels[key].style.display = key === mode ? 'block' : 'none';
                }
            });

            // 设置 canvas 光标
            canvas.style.cursor = mode === 'none' ? 'grab' : 'crosshair';

            // 启动绘制模式（不再传入回调，使用事件订阅）
            if (mode !== 'none') {
                var options = getOptionsForMode(mode);
                overlaySystem.startDrawing(mode, options, canvas);
            }

            updateStatus();
            log('切换到模式: ' + mode);
        }

        // 获取当前模式的选项
        function getOptionsForMode(mode) {
            switch (mode) {
                case 'point':
                    return {
                        size: parseInt(document.getElementById('pointSize').value),
                        color: document.getElementById('pointColor').value,
                        shape: document.getElementById('pointShape').value
                    };
                case 'line':
                    return {
                        color: document.getElementById('lineColor').value,
                        width: parseInt(document.getElementById('lineWidth').value),
                        style: document.getElementById('lineStyle').value
                    };
                case 'polygon':
                    var fillHex = document.getElementById('polygonFillColor').value;
                    var opacity = parseInt(document.getElementById('polygonOpacity').value) / 100;
                    var r = parseInt(fillHex.slice(1, 3), 16);
                    var g = parseInt(fillHex.slice(3, 5), 16);
                    var b = parseInt(fillHex.slice(5, 7), 16);
                    return {
                        fill: {
                            color: 'rgba(' + r + ',' + g + ',' + b + ',' + opacity + ')'
                        },
                        stroke: {
                            color: document.getElementById('polygonStrokeColor').value,
                            width: parseInt(document.getElementById('polygonStrokeWidth').value)
                        }
                    };
                case 'text':
                    return {
                        text: document.getElementById('textContent').value || '标注',
                        content: document.getElementById('textContent').value || '标注',
                        color: document.getElementById('textColor').value,
                        fontSize: parseInt(document.getElementById('textFontSize').value)
                    };
                default:
                    return {};
            }
        }

        // 绑定模式按钮事件
        modeButtons.forEach(function(btn) {
            btn.addEventListener('click', function() {
                setMode(this.dataset.mode);
            });
        });

        // 清除按钮
        clearBtn.addEventListener('click', function() {
            overlaySystem.clear();
            log('清除所有 Overlay');
            updateStatus();
        });

        // 取消按钮
        cancelBtn.addEventListener('click', function() {
            overlaySystem.cancelDrawing();
        });

        // ========================================
        // 事件订阅（使用新的事件名称）
        // ========================================

        // 开始绘制
        overlaySystem.on('draw:start', function(data) {
            log('开始绘制: ' + data.mode);
            updateStatus();
        });

        // 添加点
        overlaySystem.on('draw:point', function(data) {
            log('添加点 #' + (data.index + 1) + ' at (' + data.position.x.toFixed(2) + ', ' + data.position.y.toFixed(2) + ')');
            updateStatus();
        });

        // 预览更新
        overlaySystem.on('draw:preview', function(state) {
            updateStatus();
        });

        // 绘制完成（核心事件）
        overlaySystem.on('draw:complete', function(result) {
            console.log('绘制结果:', result);
            log('绘制完成: ' + JSON.stringify(result));
            updateStatus();

            // 自动重新开始相同模式
            if (currentMode !== 'none') {
                setTimeout(function() {
                    setMode(currentMode);
                }, 100);
            }
        });

        // 绘制取消
        overlaySystem.on('draw:cancel', function(data) {
            log('绘制取消: ' + data.reason + ', 丢弃 ' + data.discardedPoints.length + ' 个点');
            updateStatus();
        });

        // 绘制停止
        overlaySystem.on('draw:stop', function(data) {
            // log('绘制停止: ' + data.reason);
        });

        // 监听选项变化，重新设置模式
        document.querySelectorAll('input, select').forEach(function(el) {
            el.addEventListener('change', function() {
                if (currentMode !== 'none' && overlaySystem.isDrawing()) {
                    // 重新设置模式以应用新选项
                    setMode(currentMode);
                }
            });
        });

        // 初始化
        setMode('point');
        log('系统初始化完成（重构版 API）');
    </script>
</body>
</html>
