<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Contour Core - ZRender Fixed Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        #container {
            width: 800px;
            height: 600px;
            border: 1px solid #ccc;
            margin: 20px 0;
            background: #fff;
        }
        .controls {
            margin: 10px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
        }
        button {
            margin: 5px;
            padding: 8px 16px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #0056b3;
        }
        #info {
            margin: 10px 0;
            padding: 10px;
            background: #e7f3ff;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Contour Core - ZRender Fixed Demo</h1>

    <div class="controls">
        <button onclick="resetView()">Reset View</button>
        <button onclick="zoomIn()">Zoom In (+)</button>
        <button onclick="zoomOut()">Zoom Out (-)</button>
        <button onclick="testMultiplePeaks()">Multiple Peaks</button>
    </div>

    <div id="info">
        <strong>Interactions:</strong>
        <ul>
            <li>Mouse wheel - Zoom in/out</li>
            <li>Click and drag - Pan</li>
            <li>Hover over contours - Highlight (yellow)</li>
            <li>Double click - Reset view</li>
        </ul>
    </div>

    <div id="container"></div>

    <!-- zrender is bundled in contour-core.browser.js -->
    <script src="../dist/contour-core.browser.js"></script>

    <script>
        // Check libraries loaded
        if (typeof contourCore === 'undefined') {
            document.body.innerHTML = '<h1 style="color:red">Error: contour-core not loaded!</h1>';
            throw new Error('contour-core not loaded');
        }

        // Status helper
        function setStatus(msg) {
            var info = document.getElementById('info');
            info.innerHTML = msg;
        }

        // Chart and zoom state
        var chart = null;
        var currentZoom = 1;

        // Generate test data - Multiple Gaussian peaks for guaranteed contours
        function generateMultiplePeaksGrid(size) {
            var grid = [];
            var centers = [
                {x: 0.25, y: 0.25, sigma: 0.12, amp: 15},
                {x: 0.75, y: 0.25, sigma: 0.12, amp: 12},
                {x: 0.25, y: 0.75, sigma: 0.12, amp: 10}
            ];

            for (var i = 0; i < size; i++) {
                grid[i] = [];
                for (var j = 0; j < size; j++) {
                    var x = i / (size - 1);
                    var y = j / (size - 1);
                    var z = 0;

                    for (var c = 0; c < centers.length; c++) {
                        var cx = centers[c].x;
                        var cy = centers[c].y;
                        var sigma = centers[c].sigma;
                        var amp = centers[c].amp;
                        var dx = x - cx;
                        var dy = y - cy;
                        var dist = Math.sqrt(dx * dx + dy * dy);
                        var gaussian = amp * Math.exp(-dist * dist / (2 * sigma * sigma));
                        z += gaussian;
                    }

                    grid[i][j] = z + 20;
                }
            }
            return grid;
        }

        function initChart(gridData) {
            try {
                chart = contourCore.createInteractive('#container', {
                    z: gridData,
                    contours: {
                        type: 'fill',
                        showlabels: false
                    },
                    ncontours: 12,
                    smoothing: 0.6,
                    colorscale: 'Viridis',
                    interaction: {
                        zoom: {
                            wheelEnabled: true,
                            minScale: 0.3,
                            maxScale: 5,
                            onZoom: function(data) {
                                currentZoom = data.scale;
                            }
                        },
                        pan: {
                            dragEnabled: true
                        },
                        hover: {
                            onHoverStart: function(data) {
                                setStatus('Hover: Level ' + data.level.toFixed(2));
                            },
                            onHoverEnd: function() {
                                setStatus('Ready');
                            }
                        }
                    },
                    dblclickReset: true
                });
                setStatus('Chart created with multiple peaks data!');
            } catch (e) {
                setStatus('Error: ' + e.message);
                console.error(e);
            }
        }

        function resetView() {
            if (chart) {
                chart.resetView();
                currentZoom = 1;
                setStatus('View reset');
            }
        }

        function zoomIn() {
            if (chart) {
                currentZoom = Math.min(5, currentZoom * 1.3);
                chart.zoomTo(currentZoom, 400, 300);
                setStatus('Zoom: ' + currentZoom.toFixed(2) + 'x');
            }
        }

        function zoomOut() {
            if (chart) {
                currentZoom = Math.max(0.3, currentZoom / 1.3);
                chart.zoomTo(currentZoom, 400, 300);
                setStatus('Zoom: ' + currentZoom.toFixed(2) + 'x');
            }
        }

        function testMultiplePeaks() {
            setStatus('Generating multiple peaks test data...');
            var grid = generateMultiplePeaksGrid(30);
            initChart(grid);
        }

        // Initialize on load
        window.onload = function() {
            var grid = generateMultiplePeaksGrid(30);
            initChart(grid);
        };

        // Handle resize
        window.onresize = function() {
            if (chart) {
                chart.resize(800, 600);
            }
        };
    </script>
</body>
</html>
