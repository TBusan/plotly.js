    <h1>数据示例 - 等值线渲染</h1>
    <p class="subtitle">展示不同类型数据的等值线生成效果</p>

    <div class="controls">
        <h3>控制面板</h3>
        <div class="control-group">
            <label for="renderMode">渲染模式</label>
            <select id="renderMode">
                <option value="fill">填充模式</option>
                <option value="lines">线条模式</option>
                <option value="heatmap">热力图模式</option>
            </select>
        </div>
        <div class="control-group">
            <label for="colorscale">颜色方案</label>
            <select id="colorscale">
                <option value="Viridis">Viridis</option>
                <option value="Plasma">Plasma</option>
                <option value="Hot">Hot</option>
                <option value="Jet">Jet</option>
                <option value="Earth">Earth</option>
            </select>
        </div>
        <div class="control-group">
            <label for="ncontours">等值线数量</label>
            <select id="ncontours">
                <option value="5">稀疏 (5)</option>
                <option value="10" selected>中等 (10)</option>
                <option value="15">密集 (15)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="connectgaps">空值处理 (仅数据2)</label>
            <select id="connectgaps">
                <option value="true" selected>连接空值 (connectgaps=true)</option>
                <option value="false">遮罩空值 (connectgaps=false)</option>
            </select>
        </div>
        <button onclick="updateAll()">更新所有图表</button>
    </div>

    <!-- 数据1 -->
    <div class="data-section">
        <h2>数据 1: 递增梯度数据</h2>
        <div class="info">
            <strong>特点：</strong>5×5 网格，数值从左下角到右上角递增（0 → 20），展示经典的梯度分布。
        </div>
        <div class="data-display" id="data1Display"></div>
        <div class="canvas-row">
            <div class="canvas-container">
                <canvas id="data1Canvas" width="450" height="400"></canvas>
                <div class="canvas-label">等值线渲染</div>
            </div>
            <div class="canvas-container">
                <canvas id="data1Matrix" width="450" height="400"></canvas>
                <div class="canvas-label">原始数据矩阵</div>
            </div>
        </div>
    </div>

    <!-- 数据2 -->
    <div class="data-section">
        <h2>数据 2: 包含空值的数据</h2>
        <div class="info">
            <strong>特点：</strong>7×8 网格，包含部分 null 值（约 20%），null 值主要分布在左下角区域。
            <br><strong>connectgaps=true：</strong>空值区域会被插值填充，等值线连续通过。由于有效值与数据1一致，
            插值后的等值线形状与数据1非常相似。
            <br><strong>connectgaps=false：</strong>空值区域会被白色方块遮罩，等值线不穿过该区域。
        </div>
        <div class="data-display" id="data2Display"></div>
        <div class="canvas-row">
            <div class="canvas-container">
                <canvas id="data2Canvas" width="600" height="450"></canvas>
                <div class="canvas-label">等值线渲染</div>
            </div>
        </div>
    </div>

        // 解析颜色方案
        function parseColorScale(colorscale) {
            var colors = COLOR_SCALES[colorscale] || COLOR_SCALES.Viridis;
            return colors.map(function(color, i) {
                return [i / (colors.length - 1), color];
            });
        }

        // 构建颜色映射
        function buildColorScale(levels, colorScale) {
            return levels.map(function(level, i) {
                var t = levels.length > 1 ? (i / (levels.length - 1)) : 0.5;
                var colorIdx = Math.floor(t * (colorScale.length - 1));
                colorIdx = Math.max(0, Math.min(colorScale.length - 1, colorIdx));
                return [level, colorScale[colorIdx][1]];
            });
        }

        // 创建网格对象
        function createGrid(zData) {
            var m = zData.length;
            var n = zData[0].length;
            var grid = {
                z: zData,
                x: [],
                y: []
            };
            for (var i = 0; i < n; i++) grid.x.push(i);
            for (var j = 0; j < m; j++) grid.y.push(j);
            return grid;
        }

        // 显示数据矩阵
        function displayData() {
            document.getElementById('data1Display').textContent = '数据1 (5×5):\n' + JSON.stringify(data1).replace(/],/g, '],\n');
            document.getElementById('data2Display').textContent = '数据2 (7×8):\n' + JSON.stringify(data2).replace(/],/g, '],\n');
        }

        // 绘制数据矩阵（热力图风格）
        function drawDataMatrix(canvas, zData) {
            var ctx = canvas.getContext('2d');
            var width = canvas.width;
            var height = canvas.height;
            var padding = 40;
            var m = zData.length;
            var n = zData[0].length;

            ctx.clearRect(0, 0, width, height);

            // 找到最小最大值
            var flatData = zData.flat().filter(function(v) { return v !== null && !isNaN(v); });
            var minVal = Math.min.apply(Math, flatData);
            var maxVal = Math.max.apply(Math, flatData);

            var cellWidth = (width - 2 * padding) / n;
            var cellHeight = (height - 2 * padding) / m;

            for (var i = 0; i < m; i++) {
                for (var j = 0; j < n; j++) {
                    var val = zData[i][j];
                    var x = padding + j * cellWidth;
                    var y = padding + (m - 1 - i) * cellHeight;

                    if (val === null || isNaN(val)) {
                        // 空值 - 灰色
                        ctx.fillStyle = '#e0e0e0';
                    } else {
                        // 根据值着色
                        var t = (val - minVal) / (maxVal - minVal);
                        var r = Math.floor(t * 255);
                        var b = Math.floor((1 - t) * 255);
                        ctx.fillStyle = 'rgb(' + r + ', 0, ' + b + ')';
                    }
                    ctx.fillRect(x, y, cellWidth, cellHeight);
                    ctx.strokeStyle = '#fff';
                    ctx.strokeRect(x, y, cellWidth, cellHeight);

                    // 显示数值
                    ctx.fillStyle = '#000';
                    ctx.font = '10px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    var text = val === null ? 'null' : val.toFixed(1);
                    ctx.fillText(text, x + cellWidth / 2, y + cellHeight / 2);
                }
            }
        }

        // 绘制等值线
        function drawContours(canvasId, grid, options, width, height) {
            var canvas = document.getElementById(canvasId);
            var ctx = canvas.getContext('2d');

            var result = contourCore.computeContours(grid, options);

            var colorScale = parseColorScale(options.colorscale || 'Viridis');
            var mappedColors = buildColorScale(result.levels, colorScale);

            var style = {
                width: width,
                height: height,
                padding: 40,
                coloring: options.mode,
                colorScale: mappedColors,
                smoothing: options.smoothing || 0,
                showLines: options.mode !== 'fill',
                useClipMask: true,  // 启用平滑遮罩（当 connectgaps=false 时）
                lineWidth: 1.5,
                nullRegion: {
                    visible: true,
                    fill: '#ffffff',
                    stroke: '#dddddd',
                    strokeWidth: 1,
                    showStroke: true
                },
                z: grid.z,
                x: grid.x,
                y: grid.y
            };

            ctx.clearRect(0, 0, width, height);
            contourCore.renderers.canvas.drawContours(ctx, result, style);
        }

        // 更新所有图表
        function updateAll() {
            var mode = document.getElementById('renderMode').value;
            var colorscale = document.getElementById('colorscale').value;
            var ncontours = parseInt(document.getElementById('ncontours').value);
            var connectGaps = document.getElementById('connectgaps').value === 'true';

            var options = {
                autocontour: true,
                ncontours: ncontours,
                smoothing: 0.3,
                mode: mode,
                colorscale: colorscale,
                connectgaps: connectGaps
            };

            // 绘制数据1
            var grid1 = createGrid(data1);
            drawContours('data1Canvas', grid1, options, 450, 400);

            // 绘制数据1矩阵
            drawDataMatrix(document.getElementById('data1Matrix'), data1);

            // 绘制数据2
            var grid2 = createGrid(data2);
            drawContours('data2Canvas', grid2, options, 600, 450);
        }

        // 初始化
        displayData();
        updateAll();
