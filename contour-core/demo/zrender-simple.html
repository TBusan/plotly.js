<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Contour Core - ZRender Simple Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        #container {
            width: 800px;
            height: 600px;
            border: 1px solid #ccc;
            margin: 20px 0;
            background: #fff;
        }
        .controls {
            margin: 10px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
        }
        button {
            margin: 5px;
            padding: 8px 16px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #0056b3;
        }
        #info {
            margin: 10px 0;
            padding: 10px;
            background: #e7f3ff;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Contour Core - ZRender Interactive Demo</h1>

    <div class="controls">
        <button onclick="resetView()">Reset View</button>
        <button onclick="zoomIn()">Zoom In (+)</button>
        <button onclick="zoomOut()">Zoom Out (-)</button>
    </div>

    <div id="info">
        <strong>Interactions:</strong>
        <ul>
            <li>Mouse wheel - Zoom in/out</li>
            <li>Click and drag - Pan</li>
            <li>Hover over contours - Highlight (yellow)</li>
            <li>Double click - Reset view</li>
        </ul>
    </div>

    <div id="container"></div>

    <div id="status" style="margin-top:10px;padding:10px;background:#f0f0f0;border-radius:4px;">
        Status: <span id="status-text">Ready</span>
    </div>

    <!-- zrender is bundled in contour-core.browser.js -->
    <script src="../dist/contour-core.browser.js"></script>

    <script>
        // Check libraries loaded
        if (typeof contourCore === 'undefined') {
            document.getElementById('status-text').innerHTML = '<span style="color:red">Error: contour-core not loaded!</span>';
        }

        // Generate test data - simple peaks
        function generateGrid(size) {
            var grid = [];
            for (var i = 0; i < size; i++) {
                grid[i] = [];
                for (var j = 0; j < size; j++) {
                    var x = (i - size / 2) / 8;
                    var y = (j - size / 2) / 8;
                    // Create multiple peaks
                    var z = Math.sin(x * 2) * Math.cos(y * 2) * 15 + 25;
                    z += Math.sin(x * 5 + y * 3) * 5;
                    grid[i][j] = z;
                }
            }
            return grid;
        }

        // Status helper
        function setStatus(msg) {
            document.getElementById('status-text').textContent = msg;
        }

        // Create interactive contour
        var chart = null;
        var currentZoom = 1;

        function initChart() {
            try {
                chart = contourCore.createInteractive('#container', {
                    z: generateGrid(60),
                    contours: {
                        type: 'fill',
                        showlabels: false
                    },
                    ncontours: 12,
                    smoothing: 0.6,
                    colorscale: 'Viridis',

                    interaction: {
                        zoom: {
                            wheelEnabled: true,
                            minScale: 0.3,
                            maxScale: 5,
                            onZoom: function(data) {
                                currentZoom = data.scale;
                                setStatus('Zoom: ' + data.scale.toFixed(2) + 'x');
                            }
                        },
                        pan: {
                            dragEnabled: true,
                            onPanStart: function() {
                                setStatus('Panning...');
                            },
                            onPanEnd: function() {
                                setStatus('Ready');
                            }
                        },
                        hover: {
                            onHoverStart: function(data) {
                                setStatus('Hover: Level ' + data.level.toFixed(2));
                            },
                            onHoverEnd: function() {
                                setStatus('Ready');
                            }
                        }
                    },
                    dblclickReset: true,
                    onReset: function() {
                        currentZoom = 1;
                        setStatus('View reset');
                    }
                });

                setStatus('Ready - Chart created successfully!');
            } catch (e) {
                setStatus('Error: ' + e.message);
                console.error(e);
            }
        }

        // Control functions
        function resetView() {
            if (chart) {
                chart.resetView();
                currentZoom = 1;
                setStatus('View reset');
            }
        }

        function zoomIn() {
            if (chart) {
                currentZoom = Math.min(5, currentZoom * 1.3);
                chart.zoomTo(currentZoom, 400, 300);
                setStatus('Zoom: ' + currentZoom.toFixed(2) + 'x');
            }
        }

        function zoomOut() {
            if (chart) {
                currentZoom = Math.max(0.3, currentZoom / 1.3);
                chart.zoomTo(currentZoom, 400, 300);
                setStatus('Zoom: ' + currentZoom.toFixed(2) + 'x');
            }
        }

        // Initialize when page loads
        window.onload = function() {
            initChart();
        };

        // Handle resize
        window.onresize = function() {
            if (chart) {
                chart.resize(800, 600);
            }
        };
    </script>
</body>
</html>
