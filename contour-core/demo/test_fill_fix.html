<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>填充模式测试 - 数据范围修复验证</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .canvas-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        canvas {
            border: 2px solid #333;
            background: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .info {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
        .success {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
        }
    </style>
</head>
<body>
    <h1>填充模式测试 - 数据范围修复验证</h1>

    <div class="info">
        <strong>测试目的：</strong> 验证填充模式下，背景色只填充在数据范围内（padding区域内），
        而不是填充整个画布。
        <br><br>
        <strong>预期结果：</strong> 等值线填充应该只在数据区域内显示，padding区域外应该保持白色背景。
    </div>

    <div class="canvas-container">
        <canvas id="canvas1" width="600" height="500"></canvas>
    </div>

    <div class="info" id="result">
        请查看上方画布，验证填充是否只在数据范围内显示。
    </div>

    <script src="../dist/contour-core.browser.min.js"></script>
    <script>
        // 颜色定义
        var COLOR_SCALES = {
            Viridis: ['#440154', '#482878', '#3e4a89', '#31688e', '#26838f', '#1f9d8a', '#35b779', '#6dcd59', '#b4de2c', '#fde725'],
        };

        function parseColorScale(colorscale) {
            var colors = COLOR_SCALES[colorscale] || COLOR_SCALES.Viridis;
            return colors.map(function(color, i) {
                return [i / (colors.length - 1), color];
            });
        }

        function buildColorScale(levels, colorScale) {
            return levels.map(function(level, i) {
                var t = levels.length > 1 ? (i / (levels.length - 1)) : 0.5;
                var colorIdx = Math.floor(t * (colorScale.length - 1));
                colorIdx = Math.max(0, Math.min(colorScale.length - 1, colorIdx));
                return [level, colorScale[colorIdx][1]];
            });
        }

        function generateGrid(size) {
            var grid = { z: [], x: [], y: [] };

            for (var i = 0; i < size; i++) {
                grid.z[i] = [];
                grid.y.push(i);
                for (var j = 0; j < size; j++) {
                    if (i === 0) grid.x.push(j);
                    var dx = j - size / 2;
                    var dy = i - size / 2;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    grid.z[i][j] = 100 * Math.exp(-dist * dist / 50);
                }
            }
            return grid;
        }

        function testFillMode() {
            var canvas = document.getElementById('canvas1');
            var ctx = canvas.getContext('2d');

            // 清空画布
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 生成数据
            var grid = generateGrid(20);

            // 计算等值线
            var result = contourCore.computeContours(grid, {
                autocontour: true,
                ncontours: 10,
                smoothing: 0
            });

            var colorScale = parseColorScale('Viridis');
            var mappedColors = buildColorScale(result.levels, colorScale);

            // 绘制
            var style = {
                width: canvas.width,
                height: canvas.height,
                padding: 50,  // 较大的padding以便于观察
                coloring: 'fill',
                colorScale: mappedColors,
                showLines: true,
                lineWidth: 1,
                z: grid.z,
                x: grid.x,
                y: grid.y
            };

            // 绘制边框以便于观察padding区域
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            // 绘制数据区域边界（红色虚线）
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 2;
            ctx.strokeRect(style.padding, style.padding,
                          canvas.width - 2 * style.padding,
                          canvas.height - 2 * style.padding);
            ctx.setLineDash([]);

            // 绘制等值线
            contourCore.renderers.canvas.drawContours(ctx, result, style);

            // 验证结果
            var resultDiv = document.getElementById('result');
            resultDiv.className = 'info success';
            resultDiv.innerHTML = '<strong>测试完成！</strong><br>' +
                '✓ 红色虚线框表示数据范围边界<br>' +
                '✓ 等值线填充应该只在红色虚线框内显示<br>' +
                '✓ 红色虚线框外的padding区域应该保持白色背景<br>' +
                '如果看到红色虚线框外有填充色，说明修复失败。';
        }

        // 运行测试
        testFillMode();
    </script>
</body>
</html>
